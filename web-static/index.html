<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>localLLM</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
            <path d="M7 13.5C7 13.5 8.5 11.5 10 11.5C11.5 11.5 13 13.5 13 13.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="8.5" cy="9" r="0.8" fill="currentColor" opacity="0.7"/>
            <circle cx="11.5" cy="9" r="0.8" fill="currentColor" opacity="0.7"/>
          </svg>
          <span>localLLM</span>
        </div>
        <button class="new-chat-btn" onclick="showNewConversation()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>새 대화</span>
        </button>
      </div>
      <div class="sidebar-scroll" id="conversation-list"></div>
      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" onclick="switchTab('settings')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="2.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M7 1.5v1.5M7 11v1.5M1.5 7h1.5M11 7h1.5M3 3l1 1M10 10l1 1M11 3l-1 1M4 10l-1 1" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          </svg>
          <span>설정</span>
        </button>
        <button class="sidebar-footer-btn" onclick="showServerInfo()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M7 5v3M7 9.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span>서버 정보</span>
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <!-- Chat -->
      <div id="tab-chat" class="tab active">
        <div class="chat-area">
          <div class="messages-container" id="chat-messages">
            <div class="welcome-screen">
              <div class="logo-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                  <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
                  <path d="M16 33C16 33 19.5 27 24 27C28.5 27 32 33 32 33" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="20" cy="20" r="2" fill="currentColor" opacity="0.6"/>
                  <circle cx="28" cy="20" r="2" fill="currentColor" opacity="0.6"/>
                </svg>
              </div>
              <h1>localLLM에 오신 것을 환영합니다</h1>
              <div class="welcome-actions">
                <button class="welcome-action" onclick="createNewConversation()">
                  대화 시작하기
                  <small>새로운 대화방에서 시작하세요</small>
                </button>
                <button class="welcome-action" onclick="document.getElementById('chat-input').focus()">
                  추론 테스트
                  <small>"안녕"이라고 입력해보세요</small>
                </button>
                <button class="welcome-action" onclick="switchTab('settings')">
                  모델 설정
                  <small>Temperature, 토큰 수 등 조정</small>
                </button>
                <button class="welcome-action" onclick="showServerInfo()">
                  서버 정보
                  <small>접속 주소 확인</small>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="input-area">
          <div class="input-container">
            <div class="input-box">
              <textarea id="chat-input" placeholder="메시지를 입력하세요..." rows="1" onkeydown="handleInputKey(event)"></textarea>
              <div class="input-actions">
                <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </button>
              </div>
            </div>
            <div class="input-hint">Enter로 전송 · Shift+Enter로 줄바꿈</div>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div id="tab-settings" class="tab">
        <div class="settings-panel">
          <h2>설정</h2>
          <div class="settings-group">
            <h3>모델 설정</h3>
            <div class="settings-row">
              <div>
                <div class="settings-label">모델</div>
                <div class="settings-desc">추론에 사용할 LLM</div>
              </div>
              <input type="text" id="set-model" class="settings-input" placeholder="demo-llama3-8b">
            </div>
            <div class="settings-row">
              <div>
                <div class="settings-label">최대 토큰 수</div>
                <div class="settings-desc">응답의 최대 토큰 길이</div>
              </div>
              <input type="number" id="set-maxTokens" class="settings-input" min="64" max="8192" placeholder="512">
            </div>
            <div class="settings-row">
              <div>
                <div class="settings-label">Temperature</div>
                <div class="settings-desc">창의성 (0.0-2.0)</div>
              </div>
              <input type="number" id="set-temperature" class="settings-input" min="0" max="2" step="0.1" placeholder="0.7">
            </div>
            <div class="settings-row">
              <div>
                <div class="settings-label">Top P</div>
                <div class="settings-desc">핵심 샘플링 임계값</div>
              </div>
              <input type="number" id="set-topP" class="settings-input" min="0" max="1" step="0.05" placeholder="0.9">
            </div>
          </div>
          <div class="settings-group">
            <h3>기능</h3>
            <div class="settings-row">
              <div>
                <div class="settings-label">스트리밍</div>
                <div class="settings-desc">토큰 단위 실시간 전송</div>
              </div>
              <button class="toggle-btn" id="btn-stream" onclick="toggleSetting('streamEnabled')"></button>
            </div>
            <div class="settings-row">
              <div>
                <div class="settings-label">WebSocket</div>
                <div class="settings-desc">양방향 실시간 통신</div>
              </div>
              <button class="toggle-btn" id="btn-ws" onclick="toggleSetting('wsEnabled')"></button>
            </div>
            <div class="settings-row">
              <div>
                <div class="settings-label">자동 스크롤</div>
                <div class="settings-desc">새 메시지의 최하단 자동 이동</div>
              </div>
              <button class="toggle-btn" id="btn-autoscroll" onclick="toggleSetting('autoScroll')"></button>
            </div>
          </div>
          <div class="settings-group">
            <h3>테마</h3>
            <div class="theme-buttons">
              <button class="theme-btn active" data-theme="dark" onclick="setTheme('dark')">다크</button>
              <button class="theme-btn" data-theme="light" onclick="setTheme('light')">라이트</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Conversation Modal -->
  <div id="new-conv-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <h3>새 대화</h3>
      <input type="text" id="new-conv-name" placeholder="대화 이름 (선택사항)">
      <div class="modal-actions">
        <button class="btn-primary" onclick="submitNewConversation()">생성</button>
        <button class="btn-secondary" onclick="hideNewConversation()">취소</button>
      </div>
    </div>
  </div>

  <!-- Error Modal -->
  <div id="error-modal" class="modal-overlay" style="display:none">
    <div class="modal error-modal">
      <div class="error-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="#eab308" stroke-width="1.5"/>
          <path d="M20 12v10M20 25v1" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>서버 연결 끊김</h3>
      <p id="error-message">서버에 연결할 수 없습니다.</p>
      <div class="modal-actions">
        <button class="btn-primary" onclick="hideErrorModal()">확인</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
